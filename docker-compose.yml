services:
  web:
    container_name: stop-carburant-web
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped

  test:
    container_name: stop-carburant-test
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CI=true
    command: ["npm", "test"]

  scraper:
    container_name: stop-carburant-scraper
    build:
      context: .
      dockerfile: Dockerfile.scraper
    volumes:
      - .:/app
    environment:
      - CI=true
    command: ["bash", "scripts/refresh_market_data.sh"]
